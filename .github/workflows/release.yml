# Release: on a version tag (v1.2.3) build the binaries for every supported OS and publish
# them as a GitHub Release with checksums. The version string comes from the tag (without "v").
#
# To release:   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify before publishing
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Build release archives
        run: ./scripts/build.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --title "folder-inspect $GITHUB_REF_NAME" \
            --generate-notes $prerelease
