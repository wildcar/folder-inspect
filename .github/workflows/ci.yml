# Continuous integration: lint, test, cross-build on every push and pull request.
# Mirrors the Definition of Done in AGENTS.md: gofmt -l empty, go vet clean, go test green, go build OK.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: gofmt + go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:"; echo "$out"; exit 1
          fi
      - name: go vet (linux)
        run: go vet ./...
      - name: go vet (windows)
        run: GOOS=windows go vet ./...

  test:
    name: go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    name: cross-build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build all release targets
        run: ./scripts/build.sh "0.0.0-ci+${GITHUB_SHA::8}"
      - uses: actions/upload-artifact@v4
        with:
          name: folder-inspect-ci-${{ github.sha }}
          path: dist/release/*
          retention-days: 7
